<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StrangeChess Lab</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div><p class="eyebrow">STRANGECHESS / ENGINE LAB</p><h1>Play the position.</h1></div>
      <div class="status"><span class="pulse"></span><span id="turnLabel">Loading position</span></div>
    </header>
    <section class="workspace">
      <aside class="piece-panel">
        <div class="panel-heading"><span>Piece kit</span><span class="edit-mark">EDIT</span></div>
        <p class="palette-hint">Choose a piece, then click or drag it onto the board.</p>
        <div class="piece-grid" id="pieceGrid"></div>
        <button class="remove-button" id="removeButton"><span>×</span> Remove piece</button>
        <button class="done-button" id="doneButton">Done editing</button>
      </aside>
      <div class="board-wrap">
        <div class="board" id="board" aria-label="Chess board"></div>
        <div class="board-foot"><span>White at the bottom</span><span id="checkLabel"></span></div>
      </div>
      <aside class="panel">
        <div class="panel-heading"><span>Position console</span><button class="icon-button" id="resetButton" title="Reset game">↺</button></div>
        <div class="engine-card"><div><span class="label">ENGINE</span><strong>StrangeChess</strong></div><span class="engine-dot">ONLINE</span></div>
        <div class="controls">
          <label>Search depth <output id="depthValue">5</output><input id="depth" type="range" min="1" max="10" value="5"></label>
          <label>Move time <output id="timeValue">1000 ms</output><input id="time" type="range" min="100" max="5000" step="100" value="1000"></label>
        </div>
        <button class="engine-button" id="engineButton"><span>✦</span> Ask engine to move</button>
        <div class="moves-heading"><span>Move history</span><span id="moveCount">0 moves</span></div>
        <ol class="moves" id="moves"></ol>
        <div class="fen-row"><input id="fen" placeholder="Paste FEN to inspect a position"><button id="loadFen">Load</button></div>
        <p class="hint" id="hint">Select a piece, then select its destination.</p>
      </aside>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
